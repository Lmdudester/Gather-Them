{% load static %}
<div class="loading-overlay" id="loading-overlay"
     role="dialog"
     aria-modal="true"
     aria-hidden="true"
     aria-labelledby="loading-title"
     aria-describedby="loading-flavor"
     data-flavor-url="{{ loading_flavor_url }}">
    <img src="{% static 'finder/img/logo.png' %}" alt="" class="loading-logo">
    <h2 class="sr-only" id="loading-title">{{ loading_title|default:'Loading' }}</h2>
    <div class="loading-flavor" id="loading-flavor" role="status" aria-live="polite">{{ loading_copy|default:'Gathering cards...' }}</div>
    <button type="button" class="btn btn-secondary loading-cancel" id="loading-cancel">Cancel</button>
</div>
